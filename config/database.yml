default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host:     <%= ENV.fetch("DB_HOST", "127.0.0.1") %>
  port:     <%= ENV.fetch("DB_PORT", 3306) %>
  database: <%= ENV.fetch("DB_NAME", "blog_development") %>
  username: <%= ENV.fetch("DB_USER", "root") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>

development:
  <<: *default

test:
  <<: *default
  database: blog_test

production:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "blog_production") %>
