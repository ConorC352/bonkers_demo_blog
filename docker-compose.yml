services:
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: blog_development
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build: .
    command: bash -c "bundle exec rails db:migrate db:seed && bundle exec rails server -b 0.0.0.0 -p 3001"
    ports:
      - "3001:3001"
    environment:
      RAILS_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: blog_development
      DB_USER: root
      DB_PASSWORD: password
      MYSQL_SSL_CA: ""
      LIBMYSQL_ENABLE_CLEARTEXT_PLUGIN: 1
      MARIADB_OPT_SSL_VERIFY_SERVER_CERT: "0"
      SSL_CERT_FILE: ""
      OPENSSL_CONF: /dev/null
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_GRAPHQL_URL: http://localhost:3001/graphql
    depends_on:
      - api

volumes:
  mysql_data:
