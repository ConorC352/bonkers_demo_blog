apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: blog
data:
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: blog_development
  DB_USER: root
  RAILS_ENV: development
  MYSQL_SSL_CA: ""
  LIBMYSQL_ENABLE_CLEARTEXT_PLUGIN: "1"
  MARIADB_OPT_SSL_VERIFY_SERVER_CERT: "0"
  SSL_CERT_FILE: ""
  OPENSSL_CONF: "/dev/null"
---
apiVersion: v1
kind: Secret
metadata:
  name: rails-secret
  namespace: blog
type: Opaque
stringData:
  SECRET_KEY_BASE: "5f31b3f32041b1b1a9bf197892cc85cba4e5c600b97a14bf257632c73c18141d5fd71d324242c1781791be77da9bea2f4efafaeeea08ed9d566e352bed7e58c8"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-api
  namespace: blog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog-api
  template:
    metadata:
      labels:
        app: blog-api
    spec:
      initContainers:
        - name: db-migrate
          image: blog-api:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c", "bundle exec rails db:create db:migrate db:seed"]
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: rails-secret
                  key: SECRET_KEY_BASE
      containers:
        - name: blog-api
          image: blog-api:latest
          imagePullPolicy: IfNotPresent
          command: ["bundle", "exec", "rails", "server", "-b", "0.0.0.0", "-p", "3001"]
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: rails-secret
                  key: SECRET_KEY_BASE
          livenessProbe:
            httpGet:
              path: /up
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /up
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: blog-api
  namespace: blog
spec:
  selector:
    app: blog-api
  ports:
    - port: 3001
      targetPort: 3001
