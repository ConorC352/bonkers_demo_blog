apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: blog
data:
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: blog_production
  DB_USER: root
  RAILS_ENV: production
---
apiVersion: v1
kind: Secret
metadata:
  name: rails-secret
  namespace: blog
type: Opaque
stringData:
  SECRET_KEY_BASE: "replace-with-output-of-rails-secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-api
  namespace: blog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog-api
  template:
    metadata:
      labels:
        app: blog-api
    spec:
      containers:
        - name: blog-api
          image: blog-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: rails-secret
                  key: SECRET_KEY_BASE
          livenessProbe:
            httpGet:
              path: /up
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /up
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: blog-api
  namespace: blog
spec:
  selector:
    app: blog-api
  ports:
    - port: 3001
      targetPort: 3001
